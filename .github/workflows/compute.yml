name: Compute local pilot
on:
  push:
    paths: ['src/mathkernel_compute/**', 'tests/compute/**', 'pyproject.toml', '.github/workflows/compute.yml']
  pull_request:
    paths: ['src/mathkernel_compute/**', 'tests/compute/**', 'pyproject.toml', '.github/workflows/compute.yml']
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[compute,dev,perf]' build
      - run: python -m unittest discover -s tests/compute -v
      - run: python -m pytest tests/test_jobs.py tests/test_cuboid.py tests/test_engineering_signal.py tests/test_evidence_composition_hardening.py -q
      - run: python -m unittest discover -s tests -p test_workflow_runtime.py -v
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: mathkernel-compute-${{ matrix.python }}
          path: dist/*
