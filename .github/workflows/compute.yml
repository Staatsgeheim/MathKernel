name: Compute adapters
on:
  push:
    paths: ['src/mathkernel_compute/**', 'tests/compute/**', 'pyproject.toml', '.github/workflows/compute.yml']
  pull_request:
    paths: ['src/mathkernel_compute/**', 'tests/compute/**', 'pyproject.toml', '.github/workflows/compute.yml']
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[compute,compute-modal,compute-runpod,dev,perf]' build 'paramiko>=3,<5'
      - run: python -m pytest tests/compute -q
      - run: python -m pytest tests/test_jobs.py tests/test_cuboid.py tests/test_engineering_signal.py tests/test_evidence_composition_hardening.py -q
      - run: python -m unittest discover -s tests -p test_workflow_runtime.py -v
      - run: python -m build
      - if: matrix.python == '3.12'
        run: python -m pip download --dest wheelhouse '.[compute,compute-modal,compute-runpod,compute-runpod-worker]' 'setuptools>=77' wheel
      - if: matrix.python == '3.12'
        run: python tools/qualify_compute_release.py --wheel dist/*.whl --sdist dist/*.tar.gz --wheelhouse wheelhouse --output qualification
      - uses: actions/upload-artifact@v4
        with:
          name: mathkernel-compute-${{ matrix.python }}
          path: |
            dist/*
            qualification/qualification.json
            qualification/*-freeze.txt
