[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathkernel"
version = "1.3.1.dev2"
description = "Evidence-aware multi-engine mathematics runtime for LLMs: exact, symbolic, formal, certified-interval and numeric computation with typed MathIR, trust labels, and full provenance — as a Python library and an MCP server"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Maarten Boone"}]
keywords = ["mathematics", "symbolic", "verification", "mcp", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2,<3",
  "cloudpickle>=3.1,<4",
  "sympy>=1.13",
  "lark>=1.1",
  "mpmath>=1.3",
  "numpy>=1.26",
  "z3-solver>=4.13",
]

[project.optional-dependencies]
mcp = ["fastmcp>=3,<4"]
dev = ["pytest>=8"]
# Complete CPU test suite. Lean setup and CUDA hardware remain explicit.
test = [
  "pytest>=8", "fastmcp>=3,<4", "numba>=0.59",
  "antlr4-python3-runtime==4.11", "matplotlib>=3.8",
  "scipy>=1.11", "clarabel>=0.11,<1", "python-flint>=0.6",
]
perf = ["numba>=0.59"]
cuda = [
  "cupy-cuda12x>=13.0",
  # cupy wheels ship no CUDA libraries; without these, cublas/nvrtc DLL loads fail
  "nvidia-cuda-runtime-cu12",
  "nvidia-cublas-cu12",
  "nvidia-cufft-cu12",
  "nvidia-curand-cu12",
  "nvidia-cusolver-cu12",
  "nvidia-cusparse-cu12",
  "nvidia-cuda-nvrtc-cu12",
  "nvidia-nvjitlink-cu12",
]
latex = ["antlr4-python3-runtime==4.11"]
viz = ["matplotlib>=3.8"]
sci = ["scipy>=1.11"]
conic = ["clarabel>=0.11,<1", "scipy>=1.11"]
certified = ["python-flint>=0.6"]

[project.scripts]
mathkernel-mcp = "mathkernel_mcp.server:main"
mathkernel-lean-setup = "mathkernel.lean_bootstrap:main"
mathkernel-formal-audit = "mathkernel.formal_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mathkernel" = ["py.typed", "lean_workspace/*"]
"mathkernel_viz" = ["assets/*"]
"mathkernel_multimodal" = ["assets/*"]

[tool.pytest.ini_options]
# Standalone experiment packages have their own documented PYTHONPATH.
# Core discovery must not accidentally import uninstalled experiment packages.
testpaths = ["tests"]
addopts = "--ignore=tests/test_companion.py"
